server {
    server_name chain-rpc.online www.chain-rpc.online;
    access_log  /var/log/nginx/chain-rpc.log;
    client_max_body_size 10M;

    location /static/ {
        root /home/piekuser/chain-rpc.online;
        expires 30d;
    }
 
    location / {
        proxy_pass http://127.0.0.1:3000; 
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chain-rpc.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chain-rpc.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = www.chain-rpc.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = chain-rpc.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name chain-rpc.online www.chain-rpc.online;
    return 404; # managed by Certbot
}