limit_req_zone $binary_remote_addr zone=mylimit:10m rate=1r/s;

server {
    listen 443;
    server_name api.chain-rpc.online www.api.chain-rpc.online;
    access_log  /var/log/nginx/chain-rpc.log;
    client_max_body_size 10M;
 
    location / {
        limit_req zone=mylimit burst=20 nodelay;

        proxy_pass http://127.0.0.1:13337; 
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    ssl_certificate /etc/letsencrypt/live/api.chain-rpc.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.chain-rpc.online/privkey.pem; # managed by Certbot
}
server {
    if ($host = api.chain-rpc.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.chain-rpc.online www.api.chain-rpc.online;
    return 404; # managed by Certbot
}